name: Generar Invitaciones

on:
  push:
    paths:
      - 'invitados.csv'
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar invitaciones
        run: node scripts/generar-invitaciones.js

      - name: Commit invitaciones generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add invitacion/
          git diff --staged --quiet || git commit -m "auto: regenerar invitaciones desde CSV"
          git push
