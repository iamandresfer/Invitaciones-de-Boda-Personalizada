<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Boda Gloria & Juan</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --text: #2C2C2C;
      --text-secondary: #6B6B6B;
      --gold: #C9A96E;
      --olive: #3B4334;
      --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 24px;
      min-height: 100vh;
    }

    /* Login */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .login-box {
      text-align: center;
      max-width: 320px;
      width: 100%;
      padding: 0 24px;
    }
    .login-box h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .login-box p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 16px;
      border-radius: 2px;
      text-align: center;
    }
    .login-box input:focus {
      outline: none;
      border-color: var(--gold);
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--olive);
      color: var(--white);
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.3s;
    }
    .login-box button:hover { background: #2a3028; }
    .login-error {
      color: #c0392b;
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }

    /* Dashboard */
    #dashboard { display: none; max-width: 900px; margin: 0 auto; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 1.5rem;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--white);
      padding: 20px;
      border-radius: 4px;
      text-align: center;
      border: 1px solid #eee;
    }
    .stat-number {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      color: var(--olive);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .controls input,
    .controls select {
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
      border-radius: 2px;
      flex: 1;
      min-width: 150px;
    }
    .controls input:focus,
    .controls select:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #eee;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.85rem;
    }
    th {
      background: var(--olive);
      color: var(--white);
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { background: #2a3028; }
    td:last-child { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-confirmado { color: var(--olive); font-weight: 500; }
    .status-pendiente { color: var(--gold); font-weight: 500; }
    .empty-msg { text-align: center; padding: 40px; color: var(--text-secondary); }
    .error-msg { text-align: center; padding: 40px; color: #c0392b; }

    @media (max-width: 600px) {
      body { padding: 20px 16px; }
      th, td { padding: 10px 12px; font-size: 0.8rem; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-box">
      <h2>Panel de Control</h2>
      <p>Boda Gloria & Juan</p>
      <input type="password" id="password-input" placeholder="Contrasena" autofocus>
      <button onclick="checkPassword()">Entrar</button>
      <p class="login-error" id="login-error">Contrasena incorrecta</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <h1>Panel de Control - Gloria & Juan</h1>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="stat-total">-</div>
        <div class="stat-label">Total Invitados</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-confirmados">-</div>
        <div class="stat-label">Confirmados</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-pendientes">-</div>
        <div class="stat-label">Pendientes</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-cupos">-</div>
        <div class="stat-label">Cupos Confirmados</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Buscar por nombre...">
      <select id="filter-status">
        <option value="all">Todos</option>
        <option value="Confirmado">Confirmados</option>
        <option value="Pendiente">Pendientes</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th onclick="sortTable(0)">Nombre</th>
          <th onclick="sortTable(1)">Cupos Asignados</th>
          <th onclick="sortTable(2)">Cupos Confirmados</th>
          <th onclick="sortTable(3)">Estado</th>
          <th onclick="sortTable(4)">Mensaje</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5" class="empty-msg">Ingresa la contrasena para ver los datos</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // CAMBIAR ESTOS VALORES:
    var DATA_URL = "TU_URL_DE_APPS_SCRIPT_WEB_APP_AQUI";  // URL del Apps Script Web App
    var PASSWORD = "gloria2026";  // Contrasena para acceder

    var allData = [];
    var sortDir = 1;

    function checkPassword() {
      var input = document.getElementById("password-input").value;
      if (input === PASSWORD) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadData();
      } else {
        document.getElementById("login-error").style.display = "block";
        setTimeout(function() {
          document.getElementById("login-error").style.display = "none";
        }, 2000);
      }
    }

    document.getElementById("password-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkPassword();
    });

    async function loadData() {
      document.getElementById("table-body").innerHTML = '<tr><td colspan="5" class="empty-msg">Cargando datos...</td></tr>';
      try {
        var response = await fetch(DATA_URL);
        allData = await response.json();
        updateStats();
        renderTable(allData);
      } catch (err) {
        document.getElementById("table-body").innerHTML = '<tr><td colspan="5" class="error-msg">Error al cargar datos. Verifica la URL del endpoint en admin.html.</td></tr>';
      }
    }

    function updateStats() {
      var total = allData.length;
      var confirmados = 0;
      var cupos = 0;
      for (var i = 0; i < allData.length; i++) {
        if (allData[i]["Estado"] === "Confirmado") confirmados++;
        cupos += parseInt(allData[i]["Cupos Confirmados"]) || 0;
      }
      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-confirmados").textContent = confirmados;
      document.getElementById("stat-pendientes").textContent = total - confirmados;
      document.getElementById("stat-cupos").textContent = cupos;
    }

    function renderTable(data) {
      var tbody = document.getElementById("table-body");
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Sin respuestas aun</td></tr>';
        return;
      }
      var html = "";
      for (var i = 0; i < data.length; i++) {
        var r = data[i];
        var estado = (r["Estado"] || "").toLowerCase();
        html += "<tr>"
          + "<td>" + (r["Nombre"] || "-") + "</td>"
          + "<td>" + (r["Cupos Asignados"] || "-") + "</td>"
          + "<td>" + (r["Cupos Confirmados"] || "-") + "</td>"
          + '<td class="status-' + estado + '">' + (r["Estado"] || "-") + "</td>"
          + "<td>" + (r["Mensaje"] || "-") + "</td>"
          + "</tr>";
      }
      tbody.innerHTML = html;
    }

    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("filter-status").addEventListener("change", applyFilters);

    function applyFilters() {
      var search = document.getElementById("search").value.toLowerCase();
      var status = document.getElementById("filter-status").value;
      var filtered = allData;
      if (search) {
        filtered = filtered.filter(function(d) {
          return (d["Nombre"] || "").toLowerCase().indexOf(search) !== -1;
        });
      }
      if (status !== "all") {
        filtered = filtered.filter(function(d) { return d["Estado"] === status; });
      }
      renderTable(filtered);
    }

    function sortTable(col) {
      var keys = ["Nombre", "Cupos Asignados", "Cupos Confirmados", "Estado", "Mensaje"];
      var key = keys[col];
      sortDir *= -1;
      allData.sort(function(a, b) {
        var va = a[key] || "";
        var vb = b[key] || "";
        if (typeof va === "number") return (va - vb) * sortDir;
        return String(va).localeCompare(String(vb)) * sortDir;
      });
      applyFilters();
    }
  </script>
</body>
</html>
